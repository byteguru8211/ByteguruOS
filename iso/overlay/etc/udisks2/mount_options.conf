# ByteguruOS — политика монтирования съёмных/внутренних томов через udisks2.
#
# Формат проверен по официальному справочнику UDisks (Configurable mount options):
# файл /etc/udisks2/mount_options.conf, INI/GKeyFile, группа [defaults], ключи
# вида <fs>_defaults / <fs>_allow и <fs>:<driver>_defaults / <fs>:<driver>_allow,
# плюс <fs>_drivers для выбора драйвера. ВАЖНОЕ ОГРАНИЧЕНИЕ ИЗ СПРАВОЧНИКА:
# значение *_defaults ОБЯЗАНО быть подмножеством *_allow, иначе монтирование
# падает — поэтому ro присутствует в обоих списках.
#
# ПОЧЕМУ ro ПО УМОЛЧАНИЮ (политика проекта, dual boot — первоклассное требование):
# 1. Живая NTFS-разметка Windows (журнал $UsnJrnl, гибернация, Fast Startup) при
#    записи из Linux легко приводит к повреждению тома на стороне Windows.
# 2. Цена ошибки для пользователя: «не удалось загрузить Windows» вместо
#    «пришлось нажать «Запись»».
# 3. Чтение по-прежнему доступно всегда, а запись — осознанным действием.
#
# ДОКУМЕНТИРОВАННОЕ ПОЛУЧЕНИЕ ЗАПИСИ (три уровня, от разового к постоянному):
#   разово:      udisksctl mount -b /dev/sdXn -o rw
#                (или: sudo mount -t ntfs3 -o rw /dev/sdXn /mount/point)
#   на устройство: drop-in правило udev с UDISKS_MOUNT_OPTIONS_NTFS3_DEFAULTS="rw"
#                (см. /etc/udev/rules.d/90-byteguru-ntfs-readonly.rules — там же
#                 готовый раскомментированный пример по UUID)
#   постоянно:   строка в /etc/fstab с явными опциями — fstab НЕ перекрывается
#                этим файлом (udisks2 не трогает записи fstab для динамических
#                точек монтирования).
#
# Версия udisks2 в trixie: 2.10.x (в trixie есть поддержка mount_options.conf —
# она появилась в 2.9.0). Если в собранном образе окажется udisks2 < 2.9, файл
# просто игнорируется: проверка — `udisksctl --version` и наличие
# /usr/share/man/man5/udisks.conf? (TODO-VERIFY при первом прогоне CI).

[defaults]

# Ядерный драйвер ntfs3 предпочтительнее FUSE ntfs-3g (быстрее, без /dev/fuse).
# Список драйверов задаётся отдельно: ntfs3, затем запасной ntfs (FUSE).
ntfs_drivers=ntfs3,ntfs

# Чтение по умолчанию. Допустимые опции (allow) включают rw — иначе udisks
# не смог бы смонтировать на запись даже по явному запросу пользователя.
ntfs3_defaults=ro
ntfs3_allow=ro,rw,uid,gid,umask,dmask,fmask,iocharset,discard,nodiscard,sparse,nosparse,hidden,nohidden,sys_immutable,nosys_immutable,showmeta,noshowmeta,prealloc,noprealloc

# FUSE-путь (ntfs-3g) — те же права по умолчанию; windows_names оставляет
# совместимые с Windows имена файлов.
ntfs_defaults=ro
ntfs_allow=ro,rw,uid,gid,umask,dmask,fmask,locale,norecover,ignore_case,windows_names

# СОЗНАТЕЛЬНО НЕ МЕНЯЕМ: vfat/exfat/ext4. Политика «только чтение» требуется
# именно для NTFS (см. обоснование выше). Для FAT/exFAT запись по умолчанию —
# норма, и переопределять её значит сломать обычную работу с флешками.
#