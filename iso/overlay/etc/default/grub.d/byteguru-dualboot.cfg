# ByteguruOS — политики GRUB для dual boot.
#
# Механизм: grub-mkconfig (в Debian-сборке) перечитывает /etc/default/grub, а
# затем все /etc/default/grub.d/*.cfg в алфавитном порядке, поэтому drop-in не
# конфликтует с пакетным /etc/default/grub и не затирается его обновлениями.
# TODO-VERIFY: наличие grub.d в trixie — подтвердить в собранном образе
# (`grep -n 'grub.d' /usr/sbin/grub-mkconfig`), при отсутствии перенести эти
# переменные прямо в /etc/default/grub через патч overlay.

# 1. Искать другие ОС (в т.ч. Windows Boot Manager) в меню.
#    В Debian os-prober по умолчанию выключён именно из соображений безопасности
#    (вызов os-prober из grub-mkconfig — это исполнение кода с чужих томов).
#    Для дистрибутива, где dual boot — первоклассное требование, мы его включаем,
#    но вместе с GRUB_DISABLE_OS_PROBER=false оставляем только чтение:
#    os-prober не монтирует nothing writable (NTFS отдаётся на read-only).
GRUB_DISABLE_OS_PROBER=false

# 2. Таймаут: 5 секунд и видимое меню. На live-образе таймаут меньше раздражает,
#    на установленной системе 5 с — разумный компромисс для dual boot.
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu

# 3. Память выбора: после обновления Windows оно может вписать себя в начало
#    BootOrder; сохранённый выбор пользователя не должен зависеть от этого.
#    saved + SAVEDEFAULT => следующий старт = та же ОС, что выбрал человек.
GRUB_DEFAULT=saved
GRUB_SAVEDEFAULT=true

# 4. Разрешаем пользователю править порядок вручную (e= при старте).
#    GRUB_DISABLE_RECOVERY оставлен по умолчанию (recovery-записи полезны).
