# Конфигурация shared folder VirtualBox для ByteguruOS.
# Читается скриптом /usr/local/bin/byteguru-vboxsf-mount (как shell-файл
# ключ=значение; вызывающий подключает его в subshell, поэтому сюда можно
# ставить только переменные — команд здесь быть не должно).

# Список общих папок, объявленных в настройках ВМ (Machine -> Shared Folders).
# По умолчанию пусто: мы не знаем, что именно пользователь расшарил, а
# перечислить шары без Guest Additions (VBoxControl) надёжно нельзя.
# Пример: SHARES="docs downloads"
SHARES=""

# Базовый каталог, куда монтируются шары: /mnt/vbox/<имя-шары>.
MOUNT_BASE="/mnt/vbox"

# Файловая система в ядре называется vboxsf — менять не нужно.
FS_TYPE="vboxsf"

# Группа-владелец точек монтирования. vboxsf не поддерживает chmod, поэтому
# доступ целиком определяется группой и масками при монтировании.
GROUP="vboxsf"

# Маски: файлы 640 (0137 = инверсия 640 с учётом suid-битов), каталоги 750.
# Итог: читать и писать могут root и члены группы vboxsf, остальные — ничего.
# Чтобы дать доступ живому пользователю:
#   sudo usermod -aG vboxsf $USER   (перелогиниться)
FMASK="0137"
DMASK="0037"
